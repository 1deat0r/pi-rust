[workspace]
resolver = "2"
members = [
    "crates/pi-protocol",
    "crates/pi-telemetry",
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-client",
    "crates/pi-server",
    "crates/pi-session-backends",
    "crates/pi-tui",
    "crates/pi-coding-agent",
    "crates/pi-evals",
]

[workspace.package]
version = "0.84.2"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "sink"] }
bytes = "1"
async-trait = "0.1"
regex = "1"
dirs = "5"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
