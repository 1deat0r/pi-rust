<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Static pi-rust session export">
  <title>{{TITLE}}</title>
  <style>
{{CSS}}
  </style>
</head>
<body class="static-export">
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="static-export-badge">Static zero-JavaScript export</div>
      </div>
      <div class="tree-container" id="tree-container">
{{TREE}}
      </div>
      <div class="tree-status" id="tree-status">{{TREE_STATUS}}</div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Session tree"></div>
    <main id="content">
      <div class="static-export-note">This file is self-contained and rendered by Rust. Browser JavaScript is not required.</div>
      <div id="header-container">{{HEADER}}</div>
      <div id="messages">
{{ENTRIES}}
      </div>
      <div class="footer">{{FOOTER}}</div>
    </main>
  </div>
</body>
</html>
